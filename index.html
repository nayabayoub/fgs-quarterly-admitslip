<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGS Admit Slip – First Quarterly Examination</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=UnifrakturCook:wght@700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --maroon:#b0103a;
    --maroon-dark:#8a0c2d;
    --bg:#f4f5f8;
    --card:#ffffff;
    --text:#14182b;
    --muted:#5b6275;
    --line:#d9dce5;
    --deny-bg:#fdecef;
    --deny:#a1122f;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);padding:24px 16px;overflow-x:hidden}
  .card{max-width:900px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}
  .head{text-align:center}
  .logo{width:300px;max-width:85%;height:auto;display:block;margin:0 auto 10px}
  .crest{width:140px;height:140px;border-radius:50%;border:3px solid #d5d9e2;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:#fff}
  .crest img{height:112px;width:auto}
  #slip .s-crest{width:104px;height:104px;border-radius:50%;border:2px solid #000;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
  #slip .s-crest img{height:84px;width:auto}
  .school{font-size:28px;font-weight:700;letter-spacing:.5px;color:var(--maroon);margin:6px 0 2px}
  .chapter{font-size:16px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .session{font-family:Tinos,serif;font-size:19px;text-decoration:underline;margin-top:8px}
  h2{font-size:26px;margin:32px 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  label{font-weight:600;display:block;margin-bottom:8px}
  input{width:100%;padding:16px 18px;font-size:20px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
  input:focus{border-color:var(--maroon)}
  .btn{width:100%;margin-top:18px;padding:16px;font-size:20px;font-weight:700;color:#fff;background:var(--maroon);border:0;border-radius:12px;cursor:pointer}
  .btn:hover{background:var(--maroon-dark)}
  .msg{margin-top:20px;text-align:center;padding:18px;border-radius:12px;display:none;font-size:16px;line-height:1.5}
  .msg.deny{display:block;background:var(--deny-bg);color:var(--deny);border:1px solid #f3b8c4}
  .msg.deny b{font-size:20px;display:block;margin-bottom:4px}
  .msg.warn{display:block;background:#fff7e6;color:#8a5a00;border:1px solid #f1d49a}
  #slipWrap{display:none;margin-top:28px}
  .actions{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .actions button{flex:1;min-width:160px;margin:0}
  .btn.light{background:#fff;color:var(--maroon);border:2px solid var(--maroon)}

  /* ---------- Admit slip (A4) ---------- */
  #slip .short{display:none}
  #slip.pdf{width:794px !important;max-width:none !important}
  #slip{width:794px;max-width:100%;margin:0 auto;background:#fff;color:#000;padding:28px 34px;border:3px solid #000;font-family:Arial,sans-serif}
  #slip .s-logo{width:260px;max-width:70%;height:auto;display:block;margin:0 auto 6px}
  #slip .s-school{text-align:center;font-family:Tinos,serif;font-weight:700;font-size:30px;color:var(--maroon);margin:4px 0 0}
  #slip .s-chapter{text-align:center;font-size:14px;letter-spacing:1px;margin-top:4px}
  #slip .s-session{text-align:center;font-family:Tinos,serif;font-size:18px;text-decoration:underline;margin-top:6px}
  #slip .s-exam{text-align:center;font-weight:700;font-size:18px;text-decoration:underline;margin-top:6px}
  #slip .s-title{text-align:center;font-weight:700;font-size:28px;text-decoration:underline;margin:4px 0 16px}
  #slip table{width:100%;border-collapse:collapse;font-size:15px}
  #slip td,#slip th{border:1px solid #000;padding:8px 9px;text-align:left}
  #slip th{font-weight:700;background:#f6e7eb}
  #slip .info td.k{font-weight:700;width:18%;white-space:nowrap}
  #slip .ds{margin-top:16px}
  #slip .ds td.sig{width:30%}
  #slip .signs{display:flex;justify-content:space-between;margin-top:52px;font-size:15px}
  #slip .signs div{width:190px;text-align:center;border-top:1px solid #000;padding-top:6px}
  #slip .note{font-size:12.5px;margin-top:20px;line-height:1.5}
  .footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}

  @media (max-width:640px){
    body{padding:12px 10px}
    .card{padding:18px 14px;border-radius:14px}
    .crest{width:116px;height:116px}
    .crest img{height:92px}
    .school{font-size:21px}
    h2{font-size:20px;margin-top:22px}
    .sub{font-size:14px}
    input{font-size:18px;padding:14px}
    .btn{font-size:18px;padding:14px}
    .actions{flex-direction:column}
    .actions button{width:100%;min-width:0}
    #slip:not(.pdf){padding:14px 10px;border-width:2px}
    #slip:not(.pdf) .s-crest{width:84px;height:84px}
    #slip:not(.pdf) .s-crest img{height:68px}
    #slip:not(.pdf) .s-school{font-size:21px}
    #slip:not(.pdf) .s-chapter{font-size:12px}
    #slip:not(.pdf) .s-session,#slip:not(.pdf) .s-exam{font-size:15px}
    #slip:not(.pdf) .s-title{font-size:22px;margin-bottom:12px}
    #slip:not(.pdf) table{font-size:12.5px}
    #slip:not(.pdf) td,#slip:not(.pdf) th{padding:6px 5px}
    /* student info stacks on phones */
    #slip:not(.pdf) .info tr{display:grid;grid-template-columns:42% 58%}
    #slip:not(.pdf) .info td{display:block;border-top:0}
    #slip:not(.pdf) .info tr:first-child td:nth-child(-n+2){border-top:1px solid #000}
    #slip:not(.pdf) .info td.k{width:auto;white-space:normal}
    #slip:not(.pdf) .ds td.sig{width:26%}
    #slip:not(.pdf) .full{display:none}
    #slip:not(.pdf) .short{display:inline}
    #slip:not(.pdf) .ds td:first-child{white-space:nowrap}
    #slip:not(.pdf) .signs{margin-top:40px;font-size:13px}
    #slip:not(.pdf) .signs div{width:42%}
    #slip:not(.pdf) .note{font-size:11.5px}
  }
  @media print{
    body{background:#fff;padding:0}
    .card{border:0;padding:0}
    .head,.lookup,.actions,.footer,.msg{display:none !important}
    #slipWrap{display:block !important;margin:0}
  }
</style>
</head>
<body>
<div class="card">

  <div class="head">
    <div class="crest"><img src="" id="topLogo" alt="Falconhouse emblem"></div>
    <div class="school">FALCONHOUSE GRAMMAR SCHOOL</div>
    <div class="chapter">Hyderabad Chapter</div>
    <div class="session">Session 2026-2027</div>
  </div>

  <div class="lookup">
    <h2>First Quarterly Examination – Admit Slip</h2>
    <p class="sub">Enter your Roll Number (GR#) to view and download your admit slip.</p>
    <label for="roll">Roll Number / GR#</label>
    <input id="roll" type="text" inputmode="numeric" placeholder="e.g. 536" autocomplete="off">
    <button class="btn" id="viewBtn">View Admit Slip</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="slipWrap">
    <div class="actions">
      <button class="btn" id="dlBtn">Download PDF</button>
      <button class="btn light" id="printBtn">Print</button>
    </div>
    <div id="slip"></div>
  </div>

  <div class="footer">Falconhouse Grammar School · Hyderabad Chapter</div>
</div>

document.getElementById("topLogo").src = LOGO;
const norm = v => String(v).trim().replace(/\D/g,"").replace(/^0+/,"");
const blockedSet = new Set(BLOCKED.map(norm));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const msg = document.getElementById("msg");
const wrap = document.getElementById("slipWrap");
const slip = document.getElementById("slip");
let current = null;

function show(type, html){ msg.className = "msg " + type; msg.innerHTML = html; }

function lookup(){
  const r = norm(document.getElementById("roll").value);
  wrap.style.display = "none"; msg.className = "msg";
  if(!r){ show("warn","Please enter your Roll Number."); return; }

  if(blockedSet.has(r)){
    show("deny","<b style=\"margin:0\">Access Denied</b>");
    return;
  }
  const s = STUDENTS.find(x => norm(x.roll) === r);
  if(!s){ show("warn","No student found with this Roll Number. Please check and try again, or contact the school office."); return; }

  current = s;
  renderSlip(s);
  wrap.style.display = "block";
  wrap.scrollIntoView({behavior:"smooth"});
}

function classKey(c){ return String(c).trim().toUpperCase().replace(/^(GRADE|CLASS|LEVEL)\s+/,"").split(/[\s-]+/)[0]; }

function renderSlip(s){
  const ds = DATESHEETS[classKey(s.cls)] || [];
  const rows = ds.length ? ds.map(d =>
    `<tr><td>${d.date}</td><td><span class="full">${d.day}</span><span class="short">${d.day.slice(0,3)}</span></td><td>${esc(d.subject)}</td><td class="sig"></td></tr>`).join("")
    : `<tr><td colspan="4" style="text-align:center">Date sheet will be shared by the school.</td></tr>`;
  slip.innerHTML = `
    <div class="s-crest"><img src="${LOGO}" alt="Falconhouse emblem"></div>
    <div class="s-school">FALCONHOUSE GRAMMAR SCHOOL</div>
    <div class="s-chapter">HYDERABAD CHAPTER</div>
    <div class="s-session">Session 2026-2027</div>
    <div class="s-exam">First Quarterly Examination</div>
    <div class="s-title">Admit Slip</div>
    <table class="info">
      <tr><td class="k">Student Name</td><td>${esc(s.name)}</td><td class="k">Father's Name</td><td>${esc(s.father)}</td></tr>
      <tr><td class="k">Roll No / GR#</td><td>${esc(s.roll)}</td><td class="k">Class</td><td>${esc(s.cls)}</td></tr>
    </table>
    <table class="ds">
      <tr><th>Date</th><th>Day</th><th>Subject</th><th><span class="full">Invigilator's Signature</span><span class="short">Invigilator Sign</span></th></tr>
      ${rows}
    </table>
    <div class="signs"><div>Class Teacher</div><div>Principal</div></div>
    <div class="note">Note: Students must bring this admit slip to appear in the First Quarterly Examination. Students failing to bring the admit slip shall not be allowed to appear in the examination.</div>`;
}

document.getElementById("viewBtn").onclick = lookup;
document.getElementById("roll").addEventListener("keydown", e => { if(e.key==="Enter") lookup(); });
document.getElementById("printBtn").onclick = () => window.print();
document.getElementById("dlBtn").onclick = () => {
  if(!current) return;
  slip.classList.add("pdf");
  html2pdf().set({
    margin: 8,
    filename: `Admit-Slip-${current.roll}.pdf`,
    image: { type:"jpeg", quality:0.98 },
    html2canvas: { scale:2, useCORS:true },
    jsPDF: { unit:"mm", format:"a4", orientation:"portrait" }
  }).from(slip).save().then(()=>slip.classList.remove("pdf"), ()=>slip.classList.remove("pdf"));
};
</script>
</body>
